[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect API calls to the serverless Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA route fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
